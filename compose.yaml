services:
  addon:
    build: .
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - ./catalog:/catalog:ro
      - index:/data
    environment:
      JACKETT_URL: ${JACKETT_URL:-http://host.docker.internal:9117}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_INDEXERS: ${JACKETT_INDEXERS:-}
      JACKETT_PREFILL: ${JACKETT_PREFILL:-}
      P2P_ADDONS: ${P2P_ADDONS-stremthru-torz,torrentio}
      DIRECT_INDEXERS: ${DIRECT_INDEXERS-apibay,knaben,torrentscsv,therarbg,eztvtorrent}
      JACKETT_DB: /data/jackett-index.sqlite
    restart: unless-stopped
volumes:
  index:
